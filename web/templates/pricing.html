{% extends "base.html" %}
{% block title %}Subscribe{% endblock %}
{% block content %}
<h1>Subscription Plans</h1>
<div class="tiers">
    {% for tier in tiers %}
    <div class="tier-card">
        <h2>{{ tier.name }}</h2>
        <p class="price">${{ tier.price_usd }}/month</p>
        <p class="description">{{ tier.description }}</p>
        <form method="post" action="/checkout/{{ tier.key }}">
            <label for="discord_username_{{ tier.key }}">Discord username (optional, for linking later)</label>
            <input type="text" id="discord_username_{{ tier.key }}" name="discord_username" maxlength="100" placeholder="e.g. yourname">
            <button type="submit">Subscribe to {{ tier.name }}</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
